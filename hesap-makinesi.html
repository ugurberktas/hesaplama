<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hesap Makinesi Pro+</title>
<style>
  :root {
    --bg1: #0f0c29;
    --bg2: #302b63;
    --bg3: #24243e;
    --glass: rgba(255,255,255,.06);
    --glass-strong: rgba(255,255,255,.1);
    --stroke: rgba(255,255,255,.12);
    --text: #f5f6ff;
    --text-dim: rgba(245,246,255,.55);
    --accent: #f9a825;
    --accent2: #ff7043;
    --teal: #4dd0c4;
    --violet: #a78bfa;
    --danger: #ff6b81;
    --shadow: rgba(0,0,0,.45);
  }

  body.light {
    --bg1: #eef1fb;
    --bg2: #dbe2f7;
    --bg3: #cdd6f2;
    --glass: rgba(255,255,255,.55);
    --glass-strong: rgba(255,255,255,.75);
    --stroke: rgba(30,40,90,.12);
    --text: #1c2144;
    --text-dim: rgba(28,33,68,.6);
    --shadow: rgba(60,80,160,.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(1000px 600px at 15% -10%, rgba(249,168,37,.18), transparent 60%),
      radial-gradient(900px 700px at 110% 20%, rgba(167,139,250,.22), transparent 55%),
      radial-gradient(800px 800px at 50% 120%, rgba(77,208,196,.16), transparent 60%),
      linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--text);
    transition: background .5s, color .5s;
    overflow-x: hidden;
  }

  /* Arka plan yüzen baloncuklar */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: .35;
    pointer-events: none;
    animation: float 14s ease-in-out infinite;
    z-index: 0;
  }
  .orb.o1 { width: 300px; height: 300px; background: var(--accent); top: 8%; left: 6%; }
  .orb.o2 { width: 260px; height: 260px; background: var(--violet); bottom: 10%; right: 8%; animation-delay: -5s; }
  .orb.o3 { width: 220px; height: 220px; background: var(--teal); top: 55%; left: 45%; animation-delay: -9s; }

  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(30px,-40px) scale(1.12); }
  }

  .wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 22px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
    animation: rise .6s cubic-bezier(.2,.9,.3,1.1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Ana kart ---------- */
  .calculator {
    width: 360px;
    background: var(--glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--stroke);
    border-radius: 30px;
    padding: 22px;
    box-shadow: 0 30px 70px var(--shadow), inset 0 1px 0 rgba(255,255,255,.15);
    transition: background .5s;
  }

  /* ---------- Üst bar ---------- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 10px;
  }

  .mode-toggle {
    display: flex;
    background: rgba(0,0,0,.22);
    border-radius: 12px;
    padding: 4px;
    gap: 2px;
    border: 1px solid var(--stroke);
  }

  body.light .mode-toggle { background: rgba(255,255,255,.5); }

  .mode-toggle button {
    border: none;
    background: transparent;
    color: var(--text-dim);
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all .25s;
    height: auto;
    border-radius: 9px;
    letter-spacing: .4px;
  }

  .mode-toggle button.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #20160a;
    box-shadow: 0 4px 14px rgba(249,168,37,.4);
  }

  .topbar-actions { display: flex; gap: 8px; }

  .icon-btn {
    width: 38px;
    height: 38px !important;
    border-radius: 12px;
    border: 1px solid var(--stroke);
    background: var(--glass-strong);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    transition: all .22s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .icon-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px var(--shadow); color: var(--accent); }

  /* ---------- Ekran ---------- */
  .display {
    background: rgba(0,0,0,.25);
    border: 1px solid var(--stroke);
    border-radius: 22px;
    padding: 20px 22px;
    margin-bottom: 16px;
    text-align: right;
    min-height: 128px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    word-break: break-all;
    position: relative;
    overflow: hidden;
    transition: background .5s;
    box-shadow: inset 0 4px 20px rgba(0,0,0,.25);
  }

  body.light .display { background: rgba(255,255,255,.5); }

  .display::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,.06) 50%, transparent 60%);
    animation: shine 6s linear infinite;
    pointer-events: none;
  }

  @keyframes shine {
    from { transform: translateX(-60%); }
    to { transform: translateX(60%); }
  }

  .badges {
    position: absolute;
    top: 12px;
    left: 16px;
    display: flex;
    gap: 8px;
  }

  .badge {
    font-size: 10px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: .5px;
    display: none;
  }
  .badge.mem { background: rgba(77,208,196,.2); color: var(--teal); border: 1px solid rgba(77,208,196,.4); }
  .badge.err { background: rgba(255,107,129,.2); color: var(--danger); border: 1px solid rgba(255,107,129,.4); }

  .history-line {
    color: var(--text-dim);
    font-size: 14px;
    min-height: 20px;
    margin-bottom: 8px;
    opacity: .85;
  }

  .current {
    color: var(--text);
    font-size: 42px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -1px;
    transition: font-size .15s;
    text-shadow: 0 2px 12px rgba(0,0,0,.3);
  }
  .current.small { font-size: 30px; }
  .current.tiny { font-size: 22px; }
  .current.shake { animation: shake .35s; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    75% { transform: translateX(7px); }
  }

  /* ---------- Hafıza satırı ---------- */
  .memory-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  .memory-row button {
    height: 38px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 11px;
    background: transparent;
    border: 1px solid var(--stroke);
    color: var(--text-dim);
    letter-spacing: .5px;
  }

  .memory-row button:hover { color: var(--teal); border-color: var(--teal); filter: none; }

  /* ---------- Bilimsel satır ---------- */
  .sci-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 12px;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height .35s ease, opacity .35s ease;
  }
  .sci-row.open { max-height: 110px; opacity: 1; }

  .sci-row button {
    height: 44px;
    font-size: 14px;
    font-weight: 700;
    border-radius: 13px;
    background: linear-gradient(135deg, rgba(167,139,250,.22), rgba(77,208,196,.16));
    border: 1px solid rgba(167,139,250,.35);
    color: var(--violet);
  }
  .sci-row button:hover { color: #fff; box-shadow: 0 6px 16px rgba(167,139,250,.35); }

  .sci-sub {
    grid-column: span 5;
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .angle-toggle {
    background: transparent !important;
    border: 1px solid var(--stroke) !important;
    color: var(--text-dim) !important;
    width: auto;
    padding: 0 14px;
    height: 30px !important;
    font-size: 11px !important;
    font-weight: 800 !important;
    letter-spacing: 1px;
    border-radius: 8px !important;
  }
  .angle-toggle.on {
    background: linear-gradient(135deg, var(--teal), #2ea8a0) !important;
    color: #08211f !important;
    border-color: transparent !important;
  }

  /* ---------- Butonlar ---------- */
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 11px;
  }

  button {
    height: 62px;
    border: 1px solid var(--stroke);
    border-radius: 18px;
    font-size: 21px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s cubic-bezier(.3,1.6,.5,1), box-shadow .2s, filter .2s, background .5s;
    color: var(--text);
    background: var(--glass-strong);
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }

  button:hover { transform: translateY(-3px); box-shadow: 0 10px 22px var(--shadow); filter: brightness(1.12); }
  button:active { transform: scale(.93) translateY(0); box-shadow: 0 4px 10px var(--shadow); }
  button:disabled { opacity: .4; pointer-events: none; }

  .num {
    background: linear-gradient(160deg, var(--glass-strong), rgba(255,255,255,.03));
    font-weight: 600;
  }

  .op {
    background: linear-gradient(140deg, var(--accent), var(--accent2));
    color: #241505;
    border: none;
    box-shadow: 0 8px 20px rgba(249,168,37,.35);
    font-size: 24px;
  }

  .fn {
    background: rgba(255,255,255,.05);
    color: var(--text-dim);
    font-size: 17px;
  }
  .fn:hover { color: var(--danger); }

  .eq {
    background: linear-gradient(140deg, var(--teal), #2ea8a0);
    color: #06211f;
    border: none;
    grid-column: span 2;
    font-size: 27px;
    box-shadow: 0 8px 22px rgba(77,208,196,.4);
  }

  .zero { grid-column: span 2; }

  /* Ripple */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.4);
    transform: scale(0);
    animation: ripple .55s ease-out;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(4.5); opacity: 0; } }

  .brand {
    text-align: center;
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 4px;
    margin-top: 18px;
    text-transform: uppercase;
    opacity: .55;
  }

  /* ---------- Geçmiş paneli ---------- */
  .history-panel {
    width: 280px;
    background: var(--glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--stroke);
    border-radius: 30px;
    padding: 22px;
    box-shadow: 0 30px 70px var(--shadow), inset 0 1px 0 rgba(255,255,255,.15);
    max-height: 640px;
    display: flex;
    flex-direction: column;
    transition: background .5s;
    animation: rise .6s .12s cubic-bezier(.2,.9,.3,1.1) both;
  }

  .history-panel h3 {
    font-size: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-weight: 800;
    letter-spacing: .5px;
  }

  .clear-history {
    border: 1px solid rgba(255,107,129,.4) !important;
    background: rgba(255,107,129,.12) !important;
    color: var(--danger) !important;
    font-size: 10px;
    cursor: pointer;
    font-weight: 800;
    padding: 6px 10px;
    border-radius: 9px;
    height: auto !important;
    letter-spacing: .5px;
    transition: all .2s;
  }
  .clear-history:hover { background: var(--danger) !important; color: #fff !important; }

  .history-list {
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding-right: 4px;
  }
  .history-list::-webkit-scrollbar { width: 5px; }
  .history-list::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 4px; }

  .history-item {
    background: rgba(0,0,0,.18);
    border: 1px solid transparent;
    border-radius: 15px;
    padding: 11px 15px;
    cursor: pointer;
    transition: all .2s;
    animation: slideIn .3s ease both;
  }
  body.light .history-item { background: rgba(255,255,255,.55); }

  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

  .history-item:hover {
    border-color: var(--teal);
    transform: translateX(4px);
    box-shadow: 0 6px 16px var(--shadow);
  }

  .history-item .expr { color: var(--text-dim); font-size: 12px; }
  .history-item .res { color: var(--text); font-size: 18px; font-weight: 800; margin-top: 3px; }

  .history-empty {
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    padding: 40px 10px;
    opacity: .6;
    line-height: 1.7;
  }

  /* ---------- Yardımcı panel ---------- */
  .help-chip {
    position: fixed;
    bottom: 22px;
    right: 22px;
    z-index: 20;
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--stroke);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 30px;
    cursor: pointer;
    transition: all .25s;
    box-shadow: 0 10px 30px var(--shadow);
  }
  .help-chip:hover { color: var(--accent); transform: translateY(-3px); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(90px);
    background: linear-gradient(135deg, var(--teal), #2ea8a0);
    color: #06211f;
    padding: 12px 26px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 700;
    transition: transform .35s cubic-bezier(.2,.9,.3,1.3);
    pointer-events: none;
    z-index: 99;
    box-shadow: 0 12px 30px rgba(77,208,196,.45);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    .history-panel { width: 360px; max-height: 240px; }
    .calculator { width: 360px; }
    .help-chip { display: none; }
  }
</style>
</head>
<body>

<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>

<div class="wrapper">

  <div class="calculator">
    <div class="topbar">
      <div class="mode-toggle">
        <button class="active" onclick="toggleSci(false)">KLASİK</button>
        <button onclick="toggleSci(true)">BİLİMSEL</button>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" title="Sonucu kopyala" onclick="copyResult()">⧉</button>
        <button class="icon-btn" title="Tema değiştir" onclick="toggleTheme()">◐</button>
      </div>
    </div>

    <div class="display">
      <div class="badges">
        <span class="badge mem" id="memBadge">M</span>
        <span class="badge err" id="errBadge">HATA</span>
      </div>
      <div class="history-line" id="historyLine">&nbsp;</div>
      <div class="current" id="current">0</div>
    </div>

    <div class="memory-row">
      <button onclick="memoryClear()">MC</button>
      <button onclick="memoryRecall()">MR</button>
      <button onclick="memoryAdd()">M+</button>
      <button onclick="memorySub()">M−</button>
      <button onclick="memoryStore()">MS</button>
    </div>

    <div class="sci-row" id="sciRow">
      <button onclick="sci('sin')">sin</button>
      <button onclick="sci('cos')">cos</button>
      <button onclick="sci('tan')">tan</button>
      <button onclick="sci('sqrt')">√</button>
      <button onclick="sci('pow')">xʸ</button>
      <button onclick="sci('ln')">ln</button>
      <button onclick="sci('log')">log</button>
      <button onclick="sci('fact')">n!</button>
      <button onclick="sci('inv')">1/x</button>
      <button onclick="sci('pi')">π</button>
      <div class="sci-sub">
        <button class="angle-toggle on" id="degBtn" onclick="setAngle(true)">DEG</button>
        <button class="angle-toggle" id="radBtn" onclick="setAngle(false)">RAD</button>
      </div>
    </div>

    <div class="buttons">
      <button class="fn" onclick="clearAll()">AC</button>
      <button class="fn" onclick="deleteLast()">⌫</button>
      <button class="fn" onclick="append('%')">%</button>
      <button class="op" onclick="append('/')">÷</button>

      <button class="num" onclick="append('7')">7</button>
      <button class="num" onclick="append('8')">8</button>
      <button class="num" onclick="append('9')">9</button>
      <button class="op" onclick="append('*')">×</button>

      <button class="num" onclick="append('4')">4</button>
      <button class="num" onclick="append('5')">5</button>
      <button class="num" onclick="append('6')">6</button>
      <button class="op" onclick="append('-')">−</button>

      <button class="num" onclick="append('1')">1</button>
      <button class="num" onclick="append('2')">2</button>
      <button class="num" onclick="append('3')">3</button>
      <button class="op" onclick="append('+')">+</button>

      <button class="num zero" onclick="append('0')">0</button>
      <button class="num" onclick="append('.')">.</button>
      <button class="eq" onclick="calculate()">=</button>
    </div>

    <div class="brand">Simple Calc Pro+</div>
  </div>

  <div class="history-panel">
    <h3>
      <span>🕘 Geçmiş</span>
      <button class="clear-history" onclick="clearHistory()">TEMİZLE</button>
    </h3>
    <div class="history-list" id="historyList">
      <div class="history-empty">Henüz işlem yok.<br>İşlem yaptıkça burada listelenecek.</div>
    </div>
  </div>

</div>

<button class="help-chip" onclick="showToast('Klavye: 0-9 · + - * / ^ · Enter= · Esc sıfırlar · r kök')">⌨ Kısayollar</button>

<div class="toast" id="toast">Kopyalandı!</div>

<script>
  let current = '0';
  let historyExpr = '';
  let justCalculated = false;
  let isError = false;
  let memory = null;
  let history = [];
  let sciMode = false;
  let degMode = true;

  const currentEl = document.getElementById('current');
  const historyLineEl = document.getElementById('historyLine');
  const historyListEl = document.getElementById('historyList');
  const memBadge = document.getElementById('memBadge');
  const errBadge = document.getElementById('errBadge');

  /* ---------- Biçimlendirme ---------- */
  function formatNumber(str) {
    if (!str || str === 'Hata') return str;
    return str.replace(/\d+(\.\d+)?/g, (m) => {
      if (m.startsWith('0.') || m.length <= 3) return m;
      const [int, dec] = m.split('.');
      const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return dec ? grouped + ',' + dec : grouped;
    });
  }

  function update() {
    const len = current.length;
    currentEl.classList.toggle('small', len > 11);
    currentEl.classList.toggle('tiny', len > 17);
    currentEl.textContent = isError ? 'Hata' : formatNumber(current);
    historyLineEl.innerHTML = formatNumber(historyExpr) || '&nbsp;';
    memBadge.style.display = memory !== null ? 'block' : 'none';
    errBadge.style.display = isError ? 'block' : 'none';
  }

  function errorState(msg) {
    isError = true;
    current = 'Hata';
    currentEl.classList.add('shake');
    setTimeout(() => currentEl.classList.remove('shake'), 400);
    update();
  }

  /* ---------- Giriş ---------- */
  function append(value) {
    if (isError) { clearAll(); }

    const lastChar = current.slice(-1);
    const isOperator = ['+', '-', '*', '/', '%', '^'].includes(value);

    if (justCalculated && !isOperator) {
      current = '';
      justCalculated = false;
    }
    justCalculated = false;

    if (isOperator) {
      if (current === '0' && value !== '-') return;
      if (['+', '*', '/', '%', '^'].includes(lastChar)) {
        current = current.slice(0, -1) + value;
        update();
        return;
      }
    } else if (value === '.') {
      const parts = current.split(/[\+\-\*\/\%\^]/);
      if (parts[parts.length - 1].includes('.')) return;
      if (current === '0' || current === '') current = '0';
    } else {
      if (current === '0') current = '';
    }

    current += value;
    update();
  }

  function clearAll() {
    current = '0';
    historyExpr = '';
    justCalculated = false;
    isError = false;
    update();
  }

  function deleteLast() {
    if (isError) { clearAll(); return; }
    if (justCalculated) { clearAll(); return; }
    current = current.slice(0, -1) || '0';
    update();
  }

  /* ---------- Güvenli hesaplama ---------- */
  function safeEval(expr) {
    expr = expr.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)')
               .replace(/(\d+(?:\.\d+)?)\^(-?\d+(?:\.\d+)?)/g, 'Math.pow($1,$2)');
    if (!/^[\d\+\-\*\/\.\(\)\s,Mathpow]+$/.test(expr)) {
      throw new Error('Geçersiz ifade');
    }
    return Function('"use strict"; return (' + expr + ')')();
  }

  function calculate() {
    if (isError) return;
    try {
      let result = safeEval(current);
      if (!isFinite(result) || isNaN(result)) { errorState(); return; }

      result = Math.round(result * 1e12) / 1e12;
      historyExpr = current + ' =';
      addHistory(current, result);
      current = String(result);
      justCalculated = true;
      update();
    } catch { errorState(); }
  }

  /* ---------- Bilimsel mod ---------- */
  function toggleSci(on) {
    sciMode = on;
    document.getElementById('sciRow').classList.toggle('open', on);
    document.querySelectorAll('.mode-toggle button').forEach((b, i) => {
      b.classList.toggle('active', on ? i === 1 : i === 0);
    });
  }

  function setAngle(deg) {
    degMode = deg;
    document.getElementById('degBtn').classList.toggle('on', deg);
    document.getElementById('radBtn').classList.toggle('on', !deg);
  }

  function sci(func) {
    if (isError) clearAll();
    try {
      const val = parseFloat(current);
      let result;

      switch (func) {
        case 'sin': result = Math.sin(degMode ? val * Math.PI / 180 : val); break;
        case 'cos': result = Math.cos(degMode ? val * Math.PI / 180 : val); break;
        case 'tan': {
          const rad = degMode ? val * Math.PI / 180 : val;
          if (Math.abs(Math.cos(rad)) < 1e-12) throw new Error();
          result = Math.tan(rad);
          break;
        }
        case 'sqrt':
          if (val < 0) throw new Error();
          result = Math.sqrt(val);
          break;
        case 'ln':
          if (val <= 0) throw new Error();
          result = Math.log(val);
          break;
        case 'log':
          if (val <= 0) throw new Error();
          result = Math.log10(val);
          break;
        case 'fact':
          if (val < 0 || val !== Math.floor(val) || val > 170) throw new Error();
          result = 1;
          for (let i = 2; i <= val; i++) result *= i;
          break;
        case 'inv':
          if (val === 0) throw new Error();
          result = 1 / val;
          break;
        case 'pi':
          current = String(Math.PI);
          update();
          return;
        case 'pow':
          justCalculated = false;
          if (['+', '-', '*', '/', '^'].includes(current.slice(-1))) return;
          current += '^';
          update();
          return;
      }

      result = Math.round(result * 1e12) / 1e12;
      historyExpr = func + '(' + formatNumber(current) + ')';
      addHistory(historyExpr, result);
      current = String(result);
      justCalculated = true;
      update();
    } catch { errorState(); }
  }

  /* ---------- Hafıza ---------- */
  function memGuard() { if (isError) return false; return true; }
  function memoryStore() { if (!memGuard()) return; memory = parseFloat(current) || 0; update(); showToast('Hafızaya kaydedildi 💾'); }
  function memoryRecall() { if (!memGuard() || memory === null) return; current = String(memory); justCalculated = true; update(); }
  function memoryAdd() { if (!memGuard()) return; memory = (memory || 0) + (parseFloat(current) || 0); update(); showToast('M+ ✓'); }
  function memorySub() { if (!memGuard()) return; memory = (memory || 0) - (parseFloat(current) || 0); update(); showToast('M− ✓'); }
  function memoryClear() { memory = null; update(); showToast('Hafıza temizlendi 🗑'); }

  /* ---------- Geçmiş ---------- */
  function addHistory(expr, result) {
    history.unshift({ expr: formatNumber(expr), res: formatNumber(String(result)), raw: String(result) });
    if (history.length > 50) history.pop();
    renderHistory();
  }

  function renderHistory() {
    if (history.length === 0) {
      historyListEl.innerHTML = '<div class="history-empty">Henüz işlem yok.<br>İşlem yaptıkça burada listelenecek.</div>';
      return;
    }
    historyListEl.innerHTML = history.map((h, i) => `
      <div class="history-item" onclick="useHistory(${i})" title="Sonucu kullan">
        <div class="expr">${h.expr}</div>
        <div class="res">= ${h.res}</div>
      </div>
    `).join('');
  }

  function useHistory(i) { current = history[i].raw; isError = false; justCalculated = true; update(); }
  function clearHistory() {
    history = [];
    renderHistory();
    showToast('Geçmiş temizlendi 🗑');
  }

  /* ---------- Yardımcılar ---------- */
  function copyResult() {
    const text = isError ? '' : current;
    if (!text) return;
    navigator.clipboard?.writeText(text).then(() => showToast('Kopyalandı! 📋'));
  }

  function toggleTheme() { document.body.classList.toggle('light'); }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  // Ripple efekti
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 550);
  });

  /* ---------- Klavye ---------- */
  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') append(e.key);
    else if (['+', '-', '*', '/', '.'].includes(e.key)) append(e.key);
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
    else if (e.key === 'Backspace') deleteLast();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === '%') append('%');
    else if (e.key === '^') { justCalculated = false; current += '^'; update(); }
    else if (e.key === 'r') sci('sqrt');
  });

  update();
</script>

</body>
</html>
